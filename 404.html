<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable | ARCHIVE+</title>
<script>
// GitHub Pages respecte la casse des URL : /archive_diagnostic_express.html renvoie une 404.
// On redirige toute variante de casse (avec ou sans .html) vers la page réelle.
(function () {
  const PAGES = [
    '/ARCHIVE_Diagnostic_Express.html',
    '/ARCHIVE_Self_Audit_v3.2.html',
    '/pages/ARCHIVE_Diagnostic_Express.html',
    '/pages/ARCHIVE_Self_Audit_v3.2.html'
  ];
  const norm = p => decodeURIComponent(p).toLowerCase().replace(/\/+$/, '').replace(/\.html$/, '');
  const want = norm(location.pathname);
  const hit = PAGES.find(p => norm(p) === want);
  if (hit && hit !== location.pathname) location.replace(hit + location.search + location.hash);
})();
</script>
